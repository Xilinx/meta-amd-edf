# systemd-networkd-wait-online blocks boot until ALL managed interfaces are
# online. EDF ships a single wired.network matching every ethernet device
# with DHCP, so on boards with more than one NIC where only one has a carrier
# (e.g. KR260 with two PS Ethernet ports), boot stalls for the full default
# timeout waiting on the unplugged port.
#
# --any   : succeed as soon as ANY one managed interface is online.
# --timeout: bound the no-carrier-at-all case so a fully unplugged board
#            fails fast instead of hanging boot for the default ~120s.
#
# The empty ExecStart= clears the command from the shipped unit before the
# replacement is set (ExecStart is a list and would otherwise append).
#
# The absolute /usr/lib/systemd path is safe: the systemd recipe sets
# REQUIRED_DISTRO_FEATURES += "usrmerge", so systemd only builds on a
# usrmerge layout where the binary lives under /usr/lib/systemd.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30
