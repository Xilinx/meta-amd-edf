# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# TO override a oe-core bbclass
BBPATH =. "${LAYERDIR}/oe-core/meta:"

# We have recipes-* directories, add to BBFILES
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILE_COLLECTIONS += "amd-edf-core"
BBFILE_PRIORITY_amd-edf-core = "5"

LAYERSUMMARY_amd-edf-core = "AMD Embedded Development Framework reference \
distro"
LAYERDESCRIPTION_amd-edf-core = "Distribution layer providing the amd-edf \
and amd-edf-small distros, image recipes, packagegroups, and SDK \
helpers that make up the AMD Embedded Development Framework reference \
platform."
BBFILE_PATTERN_amd-edf-core = "^${LAYERDIR}/"
BBFILE_PATTERN_IGNORE_EMPTY_amd-edf-core = "1"

LAYERDEPENDS_amd-edf-core = "\
    core \
    yocto \
    openembedded-layer \
    meta-python \
    xilinx \
    xilinx-standalone \
    xilinx-standalone-sdt \
    xilinx-microblaze \
    xilinx-demos \
    meta-xilinx-imgrcry \
    amd-adaptive-socs-core \
    amd-adaptive-socs-bsp \
    ros2-layer \
    ros2-lyrical-layer \
    openamp-layer \
    vitis-ai \
    xilinx-virtualization \
    virtualization-layer \
    security \
    tpm-layer \
    qt6-layer \
    "

LAYERSERIES_COMPAT_amd-edf-core = "wrynose"

LAYERRECOMMENDS_amd-edf-core = "\
    kria-bsp \
    kria-core \
    xilinx-mali400 \
    xilinx-gpu-malig78ae \
    xilinx-multimedia \
    jupyter-layer \
    dpdk \
    amd-dpdk \
    "

LAYERBASE_amd-edf-core = "${LAYERDIR}"
AMD-EDF_OECORE = "${LAYERBASE_amd-edf-core}/oe-core"

# The official manifest does not include a Zenoh implementation layer. Keep the
# Fast DDS and Cyclone DDS implementations available without pulling Zenoh into
# rmw-implementation, and retain test fixtures that work with those providers.
ROS_WORLD_SKIP_GROUPS:append = " zenoh"
SKIP_RECIPE[rmw-test-fixture-implementation] = ""
SKIP_RECIPE[launch-testing-ros] = ""

BBFILES_DYNAMIC += " \
    xilinx-mali400:${LAYERDIR}/dynamic-layers/xilinx-mali400/recipes-*/*/*.bb \
    xilinx-mali400:${LAYERDIR}/dynamic-layers/xilinx-mali400/recipes-*/*/*.bbappend \
    xilinx-virtualization:${LAYERDIR}/dynamic-layers/xilinx-virtualization/recipes-*/*/*.bbappend \
    kria-bsp:${LAYERDIR}/dynamic-layers/kria/recipes-*/*/*.bb \
    kria-bsp:${LAYERDIR}/dynamic-layers/kria/recipes-*/*/*.bbappend \
    "

USER_CLASSES += "amd-edf-check-image"
