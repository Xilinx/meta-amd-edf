# Build id of the automation build, empty for a local build. The guard is for
# multiconfigs that do not parse the distro conf, where an unset variable
# would expand to its own name.
BOOTBIN_VER_BUILD ?= "${@d.getVar('AMD-EDF_VER_BUILD') or ''}"
# Signature tracks the id, not its derivation.
BOOTBIN_VER_BUILD[vardepvalue] = "${BOOTBIN_VER_BUILD}"
