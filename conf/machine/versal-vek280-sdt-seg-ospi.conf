#@TYPE: Machine
#@NAME: versal-vek280-sdt-seg-ospi
#@DESCRIPTION: Machine configuration for the versal-vek280-sdt-seg-ospi boot.

#### Preamble
MACHINEOVERRIDES =. "${@['', 'versal-vek280-sdt-seg-opsi:']['versal-vek280-sdt-seg-ospi' !='${MACHINE}']}"
#### Regular settings follow

# Required versal-vek280-sdt-seg machine inclusion
require conf/machine/versal-vek280-sdt-seg.conf

EXTRA_IMAGEDEPENDS:remove = "\
    virtual/boot-bin \
    virtual/psm-firmware \
    virtual/plm \
    virtual/cdo \
    virtual/bootloader \
    arm-trusted-firmware \
    "

WIC_DEPENDS:remove = "\
    virtual/bootloader \
    virtual/boot-bin \
    virtual/arm-trusted-firmware \
    "

MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "xilinx-bootbin u-boot-xlnx-bin"

QB_BOOT_MODE += " -boot mode=8"
QB_OSPI_FILE ?= "${DEPLOY_DIR_IMAGE}/ospi-${MACHINE}.bin"
QB_OPT_APPEND:append := " -drive file=${QB_OSPI_FILE},if=mtd,format=raw,index=4"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' versal_vek280_sdt_seg_ospi']['versal-vek280-sdt-seg-ospi' != '${MACHINE}']}"
