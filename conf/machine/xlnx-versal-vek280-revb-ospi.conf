#@TYPE: Machine
#@NAME: xlnx-versal-vek280-revb-ospi
#@DESCRIPTION: Machine configuration for the xlnx-versal-vek280-revb-ospi boot.

#### Preamble
MACHINEOVERRIDES =. "${@['', 'xlnx-versal-vek280-revb-opsi:']['xlnx-versal-vek280-revb-ospi' !='${MACHINE}']}"
#### Regular settings follow

# Required xlnx-versal-vek280-revb machine inclusion
require conf/machine/xlnx-versal-vek280-revb.conf

EXTRA_IMAGEDEPENDS:remove = "\
    virtual/boot-bin \
    virtual/psm-firmware \
    virtual/plm \
    virtual/cdo \
    virtual/bootloader \
    arm-trusted-firmware \
    "

WIC_DEPENDS:remove = "\
    virtual/bootloader \
    virtual/boot-bin \
    virtual/arm-trusted-firmware \
    "

MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "xilinx-bootbin u-boot-xlnx-bin"

QB_BOOT_MODE += " -boot mode=8"
QB_OSPI_FILE ?= "${DEPLOY_DIR_IMAGE}/ospi-${MACHINE}.bin"
QB_OPT_APPEND:append := " -drive file=${QB_OSPI_FILE},if=mtd,format=raw,index=4"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' xlnx_versal_vek280_revb_ospi']['xlnx-versal-vek280-revb-ospi' != '${MACHINE}']}"
